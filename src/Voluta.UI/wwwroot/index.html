<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voluta · ops console</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark material-symbols-outlined">account_tree</span>
      <div>
        <strong>Voluta</strong>
        <div class="muted" style="font-size:12px;font-weight:400">ops console</div>
      </div>
    </div>
    <nav class="tabs">
      <button type="button" data-tab="inspector" class="active">
        <span class="material-symbols-outlined">troubleshoot</span> Run inspector
      </button>
      <button type="button" data-tab="hitl">
        <span class="material-symbols-outlined">front_hand</span> HITL queue
      </button>
      <button type="button" data-tab="topology">
        <span class="material-symbols-outlined">hub</span> Topology
      </button>
    </nav>
  </header>

  <main>
    <section id="panel-inspector" class="panel active">
      <div class="row">
        <label>Thread id
          <input id="threadId" placeholder="ui-host-hitl-1" value="ui-host-hitl-1" />
        </label>
        <button type="button" id="loadThread" class="primary">Load checkpoint</button>
        <button type="button" id="startStream" class="ghost">SSE stream</button>
        <button type="button" id="stopStream" class="ghost" disabled>Stop SSE</button>
      </div>
      <div class="grid-2">
        <div class="card" id="inspectorMeta">
          <div class="muted">Load a thread to inspect the latest C-shape checkpoint.</div>
        </div>
        <div class="card">
          <strong>Live stream</strong>
          <div class="muted" style="margin:0.35rem 0 0.5rem">
            GET /api/threads/{id}/stream — mode=checkpoint | resume | invoke
          </div>
          <div id="streamLog" class="stream-log"></div>
        </div>
      </div>
      <pre id="inspectorOut" class="card" style="margin-top:1rem">—</pre>
    </section>

    <section id="panel-hitl" class="panel">
      <div class="row">
        <button type="button" id="refreshHitl" class="primary">Refresh interrupted</button>
      </div>
      <div id="hitlList" class="list"></div>
    </section>

    <section id="panel-topology" class="panel">
      <div class="row">
        <button type="button" id="loadTopology" class="primary">Load topology</button>
      </div>
      <div id="topologyView" class="card">
        <div class="muted">Compiled graph metadata (nodes, edges, channels).</div>
      </div>
      <pre id="topologyOut" class="card" style="margin-top:1rem;display:none"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
