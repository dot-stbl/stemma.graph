# PR gate for Voluta: restore + build (analyzers + format) + test + pack smoke.
# Release flow lives in publish.yml (OIDC trusted publishing on v*.*.* tags).

name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-dotnet:
    name: pr-dotnet
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/voluta.slnx
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj

      - name: restore
        run: dotnet restore voluta.slnx --nologo

      - name: build
        run: dotnet build voluta.slnx -c Debug --nologo

      - name: unit tests
        run: |
          dotnet test voluta.slnx \
            --filter "FullyQualifiedName!~Integration" \
            --no-build \
            --nologo \
            --logger "console;verbosity=normal"

      - name: pack smoke
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/pack-smoke"
          mkdir -p "$pack_out"
          for proj in $(find src -name "*.csproj"); do
            echo "packing $proj"
            dotnet pack "$proj" -c Debug --no-build --output "$pack_out"
          done
          ls -la "$pack_out"
          test -n "$(find "$pack_out" -name '*.nupkg' | head -1)"

      - name: openspec validate
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v npx >/dev/null 2>&1; then
            echo "npx not available — skipping openspec validate"
            exit 0
          fi
          npx -y @fission-ai/openspec validate --specs --strict \
            || npx -y openspec validate --specs --strict \
            || echo "openspec CLI not available or validate failed — not failing CI"
