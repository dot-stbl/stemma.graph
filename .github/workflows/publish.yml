# Publish Voluta NuGet packages on a v*.*.* tag.
# Trust flow: GitHub Actions OIDC -> nuget.org trusted publishing.

name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push (sanity check)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/voluta.slnx
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj

      - name: restore
        run: dotnet restore voluta.slnx --nologo

      - name: build (Release)
        run: dotnet build voluta.slnx -c Release --nologo

      - name: pack
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          mkdir -p "$pack_out"
          for proj in $(find src -name "*.csproj" -not -path "*/samples/*" -not -path "*/tests/*"); do
            echo "packing $proj"
            dotnet pack "$proj" -c Release \
              --no-build \
              --include-symbols \
              --include-source \
              -p:SymbolPackageFormat=snupkg \
              --output "$pack_out"
          done
          ls -la "$pack_out"

      - name: push to nuget.org
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          dotnet nuget push "$pack_out/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
          if ls "$pack_out"/*.snupkg >/dev/null 2>&1; then
            dotnet nuget push "$pack_out/*.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          fi

      - name: dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run — packages packed but NOT pushed:"
          ls -la "${RUNNER_TEMP}/packages"
