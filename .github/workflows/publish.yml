# Publish Voluta NuGet packages on a v*.*.* tag.
# Also packs product docs into docs.tgz and attaches it to the GitHub Release
# so docs.stbl.space can pull without duplicating markdown elsewhere.
# Trust flow: GitHub Actions OIDC -> nuget.org trusted publishing.

name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push (sanity check)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pack docs.tgz
        run: |
          set -euo pipefail
          test -f docs/product.md
          test -n "$(find docs -type f \( -name '*.mdx' -o -name '*.md' \) ! -path 'docs/product.md' | head -1)"
          tar -czf "${RUNNER_TEMP}/docs.tgz" -C docs .
          echo "docs.tgz contents:"
          tar -tzf "${RUNNER_TEMP}/docs.tgz"
          ls -la "${RUNNER_TEMP}/docs.tgz"

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/voluta.slnx
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj

      - name: restore
        run: dotnet restore voluta.slnx --nologo

      - name: build (Release)
        run: dotnet build voluta.slnx -c Release --nologo

      - name: pack
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          mkdir -p "$pack_out"
          for proj in $(find src -name "*.csproj" -not -path "*/samples/*" -not -path "*/tests/*"); do
            name="$(basename "$proj" .csproj)"
            echo "packing $proj"
            # Analyzer package: no symbols; library packages get snupkg.
            if [ "$name" = "Voluta.Generators" ]; then
              dotnet pack "$proj" -c Release \
                --no-build \
                -p:IncludeSymbols=false \
                --output "$pack_out"
            else
              dotnet pack "$proj" -c Release \
                --no-build \
                --include-symbols \
                --include-source \
                -p:SymbolPackageFormat=snupkg \
                --output "$pack_out"
            fi
          done
          ls -la "$pack_out"
          # Core + Generators must exist (any version). Voluta.Testing is IsPackable=false.
          test -n "$(ls -1 "$pack_out"/Voluta.[0-9]*.nupkg 2>/dev/null | grep -E '^'"$pack_out"'/Voluta\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg$' || true)"
          core_nupkg="$(find "$pack_out" -maxdepth 1 -regextype posix-extended -regex '.*/Voluta\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg' | head -1)"
          gen_nupkg="$(find "$pack_out" -maxdepth 1 -name 'Voluta.Generators.*.nupkg' | head -1)"
          test -n "$core_nupkg"
          test -n "$gen_nupkg"
          echo "core=$core_nupkg gen=$gen_nupkg"

      - name: push to nuget.org
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          dotnet nuget push "$pack_out/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
          if ls "$pack_out"/*.snupkg >/dev/null 2>&1; then
            dotnet nuget push "$pack_out/*.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          fi

      - name: upload docs.tgz to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --generate-notes --verify-tag
          fi
          gh release upload "$tag" "${RUNNER_TEMP}/docs.tgz" --clobber

      - name: dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run — packages packed but NOT pushed; docs.tgz packed but NOT uploaded:"
          ls -la "${RUNNER_TEMP}/packages"
          echo "--- docs.tgz ---"
          ls -la "${RUNNER_TEMP}/docs.tgz"
          tar -tzf "${RUNNER_TEMP}/docs.tgz"
